name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [global, dev, prod, github]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Test modules (mocked providers)
        run: |
          for dir in modules/static-site modules/visit-counter modules/github-oidc modules/github-repository; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
